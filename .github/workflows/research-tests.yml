name: Dottie research tests
on:
  push:
    branches: [main, feature/hyperweave-cross-multidimensional]
  pull_request:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run research harness tests
        run: python -m unittest discover -s tests -q
